name: Expo Publish PR

on:
  workflow_call:
    inputs:
      pr_number:
        description: PR number
        type: number
        required: true
      platform:
        description: Platform to publish
        type: string
        required: true
      branch:
        description: Branch to publish
        type: string
        required: true
      working_directory:
        description: Working directory
        type: string
        default: apps/lifeline
      sentry_org:
        description: Sentry org
        default: kingstinct
        type: string
      sentry_project:
        description: Sentry project
        type: string
        required: true
      backend_url:
        description: Backend URL for EXPO_PUBLIC_BACKEND_ROOT_URL
        type: string
        required: false
        default: ''
      env_file:
        description: Environment file to use
        type: string
        default: .env.github
      bun_version:
        description: Bun version to use
        type: string
        required: false
      comment_id:
        description: Comment ID for expo preview action
        type: string
        required: false
    secrets:
      EXPO_TOKEN:
        description: Expo token
        required: true
      DISCORD_WEBHOOK:
        description: Discord webhook
        required: true
      SENTRY_AUTH_TOKEN:
        description: Sentry auth token
        required: true
      OP_SERVICE_ACCOUNT_TOKEN:
        description: 1Password service account token
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - name: Setup repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: cardinalby/export-env-action@4f48c4676cf6ed6f46e30899ee987ce695da7c80 # 2.2.3
        with:
          envFile: ${{ inputs.env_file }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun_version || env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@143a85f84a90555d121cde2ff5872e393a47ab9f # v1.0.0

      - name: Load secret
        uses: 1password/load-secrets-action/configure@581a835fb51b8e7ec56b71cf2ffddd7e68bb25e0 # v2.0.0
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Setup dev credentials
        run: bun run setup-dev-credentials
        working-directory: ${{ inputs.working_directory }}

      - name: Rename dev credentials
        run: mv .env.development.local .env.production.local
        working-directory: ${{ inputs.working_directory }}

      - name: Find Metro cache
        id: metro-cache-dir-path
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          result-encoding: string
          script: |
            const os = require('os');
            const path = require('path');
            return path.join(os.tmpdir(), 'metro-cache');

      - name: Cache Metro
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache-metro
        with:
          path: ${{ steps.metro-cache-dir-path.outputs.result }}
          key: metro-cache-${{ env.BUN_VERSION }}-${{ runner.os }}-${{ inputs.platform }}-${{ inputs.working_directory }}

      - name: Setup EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8.2.1
        with:
          eas-version: latest
          packager: bun
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Codegen
        run: bun run codegen

      - name: Create preview
        uses: expo/expo-github-action/preview@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8.2.1
        env:
          TAMAGUI_TARGET: native
          EXPO_PUBLIC_BACKEND_ROOT_URL: ${{ inputs.backend_url }}
        with:
          command: eas update --auto --branch=${{ inputs.branch }} --platform=${{ inputs.platform }} --message="${{ github.event.pull_request.title }}" --clear-cache
          working-directory: ${{ inputs.working_directory }}
          comment-id: ${{ inputs.comment_id || format('{0}{1}', inputs.platform, inputs.working_directory) }}

      - name: Upload sourcemaps
        run: bunx sentry-expo-upload-sourcemaps dist
        working-directory: ${{ inputs.working_directory }}
        env:
          SENTRY_URL: https://sentry.io/
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ inputs.sentry_org }}
          SENTRY_PROJECT: ${{ inputs.sentry_project }}

      - uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        if: ${{ failure() }}
        with:
          webhook: ${{ env.DISCORD_WEBHOOK }}
