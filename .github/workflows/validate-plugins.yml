name: Validate Claude Code Plugins

on:
  push:
    paths:
      - '.claude-plugin/**'
      - 'biome/**'
      - 'bun/**'
      - 'general/**'
      - 'kysely-sql/**'
      - 'react/**'
      - 'typescript/**'
      - 'scripts/**'
  pull_request:
    paths:
      - '.claude-plugin/**'
      - 'biome/**'
      - 'bun/**'
      - 'general/**'
      - 'kysely-sql/**'
      - 'react/**'
      - 'typescript/**'
      - 'scripts/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Validate marketplace completeness
        run: bun run scripts/validate-marketplace.ts

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace
        run: claude plugin validate .

      - name: Validate individual plugins
        run: |
          plugins=$(bun -e 'const marketplace = await Bun.file(".claude-plugin/marketplace.json").json(); console.log(marketplace.plugins.filter((p) => typeof p.source === "string" && p.source.startsWith("./")).map((p) => p.source.slice(2)).join(" "));')

          for plugin in $plugins; do
            echo "=== Validating $plugin ==="
            claude plugin validate "$plugin"
          done
