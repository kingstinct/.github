name: Validate Claude Code Plugins

on:
  push:
    paths:
      - '.claude-plugin/**'
      - 'biome/**'
      - 'bun/**'
      - 'general/**'
      - 'kysely-sql/**'
      - 'react/**'
      - 'typescript/**'
      - 'scripts/**'
  pull_request:
    paths:
      - '.claude-plugin/**'
      - 'biome/**'
      - 'bun/**'
      - 'general/**'
      - 'kysely-sql/**'
      - 'react/**'
      - 'typescript/**'
      - 'scripts/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Validate marketplace completeness
        run: bun run scripts/validate-marketplace.ts

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace
        run: claude plugin validate .

      - name: Validate individual plugins
        run: |
          for plugin in biome bun general kysely-sql react typescript; do
            echo "=== Validating $plugin ==="
            claude plugin validate "$plugin"
          done
